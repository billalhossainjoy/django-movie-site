{% extends "base.html" %}


{% block title %}
    Dashboard | MovieSite
{% endblock %}


{% block content %}

<div class="mb-4">

    <h1 class="fw-bold">
        Dashboard
    </h1>

    <p class="text-muted">
        MovieSite overview
    </p>

</div>


<!-- Recent Movies -->

<div class="card border-0 shadow-sm">

    <div
        class="card-header bg-white
               d-flex justify-content-between
               align-items-center py-3"
    >

        <h5 class="mb-0">
            Recent Movies
        </h5>

        <a
            href="/movies/"
            class="btn btn-primary btn-sm"
        >
            View All Movies
        </a>

    </div>


    <div class="card-body">

        <div
            id="loading"
            class="text-muted"
        >
            Loading movies...
        </div>


        <div
            id="dashboard-error"
            class="alert alert-danger d-none"
        >
            Failed to load movies.
        </div>


        <div
            id="movie-list"
            class="row g-3"
        >
        </div>

    </div>

</div>

{% endblock %}


{% block extra_js %}

<script>

async function loadDashboard() {

    const loading =
        document.getElementById("loading");

    const errorBox =
        document.getElementById("dashboard-error");

    try {

        const movieResponse = await fetch(
            "/api/movies/?page_size=10&ordering=-created_at"
        );

        if (!movieResponse.ok) {
            throw new Error("Movie API failed");
        }

        const movieData =
            await movieResponse.json();


        renderMovies(
            movieData.results ?? []
        );


        loading.classList.add("d-none");

    }

    catch (error) {

        console.error(error);

        loading.classList.add("d-none");

        errorBox.classList.remove("d-none");

    }

}


function renderMovies(movies) {

    const container =
        document.getElementById("movie-list");


    if (movies.length === 0) {

        container.innerHTML = `
            <div class="col-12">

                <div class="alert alert-secondary">

                    No movies available.

                </div>

            </div>
        `;

        return;
    }


    container.innerHTML =
        movies.map(movie => `

            <div class="col-md-6 col-lg-4">

                <div class="card h-100">

                    <div class="card-body">

                        <h5 class="card-title">
                            ${escapeHtml(movie.title)}
                        </h5>


                        <p class="mb-1">

                            <strong>
                                Director:
                            </strong>

                            ${escapeHtml(movie.director)}

                        </p>


                        <p class="mb-1">

                            <strong>
                                Release Year:
                            </strong>

                            ${movie.release_year}

                        </p>


                        <p class="text-muted small mt-3">

                            Created by:
                            ${escapeHtml(
                                movie.created_by ?? "Unknown"
                            )}

                        </p>

                    </div>


                    <div class="card-footer bg-white">

                        <a
                            href="/movies/${movie.id}/"
                            class="btn btn-outline-primary btn-sm"
                        >
                            View Details
                        </a>

                    </div>

                </div>

            </div>

        `).join("");

}


function escapeHtml(value) {

    const element =
        document.createElement("div");

    element.textContent =
        String(value ?? "");

    return element.innerHTML;

}


loadDashboard();

</script>

{% endblock %}
