{% extends "base.html" %}


{% block title %}
    Movies | MovieSite
{% endblock %}


{% block content %}

<div
    class="d-flex flex-column flex-md-row
           justify-content-between
           align-items-md-center
           gap-3 mb-4"
>

    <div>
        <h1 class="fw-bold mb-1">
            Movies
        </h1>

        <p class="text-muted mb-0">
            Browse all movies
        </p>
    </div>

</div>


<!-- Filters -->

<div class="card border-0 shadow-sm mb-4">

    <div class="card-body">

        <div class="row g-3">

            <div class="col-md-5">

                <label class="form-label">
                    Search
                </label>

                <input
                    id="search"
                    type="text"
                    class="form-control"
                    placeholder="Title, director, genre..."
                >

            </div>


            <div class="col-md-3">

                <label class="form-label">
                    Release Year
                </label>

                <input
                    id="year"
                    type="number"
                    class="form-control"
                    placeholder="2014"
                >

            </div>


            <div class="col-md-3">

                <label class="form-label">
                    Order
                </label>

                <select
                    id="ordering"
                    class="form-select"
                >

                    <option value="-created_at">
                        Newest
                    </option>

                    <option value="created_at">
                        Oldest
                    </option>

                    <option value="title">
                        Title A-Z
                    </option>

                    <option value="-title">
                        Title Z-A
                    </option>

                    <option value="-release_year">
                        Newest Release
                    </option>

                    <option value="release_year">
                        Oldest Release
                    </option>

                </select>

            </div>


            <div class="col-md-1 d-flex align-items-end">

                <button
                    id="filter-button"
                    class="btn btn-dark w-100"
                >
                    Go
                </button>

            </div>

        </div>

    </div>

</div>


<!-- Loading -->

<div
    id="loading"
    class="text-muted"
>
    Loading movies...
</div>


<!-- Error -->

<div
    id="error-message"
    class="alert alert-danger d-none"
>
    Could not load movies.
</div>


<!-- Results -->

<div
    id="movie-list"
    class="row g-4"
>
</div>


<!-- Pagination -->

<div
    class="d-flex justify-content-between
           align-items-center mt-4"
>

    <button
        id="previous-button"
        class="btn btn-outline-secondary"
        disabled
    >
        Previous
    </button>


    <span
        id="page-info"
        class="text-muted"
    >
    </span>


    <button
        id="next-button"
        class="btn btn-outline-secondary"
        disabled
    >
        Next
    </button>

</div>

{% endblock %}


{% block extra_js %}

<script>

let currentPage = 1;

let nextPage = null;
let previousPage = null;


async function loadMovies(page = 1) {

    const loading =
        document.getElementById("loading");

    const errorMessage =
        document.getElementById("error-message");

    loading.classList.remove("d-none");

    errorMessage.classList.add("d-none");


    const search =
        document.getElementById(
            "search"
        ).value.trim();


    const year =
        document.getElementById(
            "year"
        ).value;


    const ordering =
        document.getElementById(
            "ordering"
        ).value;


    const params =
        new URLSearchParams();


    params.set("page", page);

    params.set(
        "page_size",
        10
    );


    if (search) {

        params.set(
            "search",
            search
        );

    }


    if (year) {

        params.set(
            "release_year",
            year
        );

    }


    if (ordering) {

        params.set(
            "ordering",
            ordering
        );

    }


    try {

        const response = await fetch(
            `/api/movies/?${params.toString()}`
        );


        if (!response.ok) {

            throw new Error(
                "Failed to load movies"
            );

        }


        const data =
            await response.json();


        currentPage = page;

        nextPage =
            data.next;

        previousPage =
            data.previous;


        renderMovies(
            data.results ?? []
        );


        updatePagination(
            data.count ?? 0
        );


        loading.classList.add(
            "d-none"
        );

    }

    catch (error) {

        console.error(error);

        loading.classList.add(
            "d-none"
        );

        errorMessage.classList.remove(
            "d-none"
        );

    }

}



function renderMovies(movies) {

    const container =
        document.getElementById(
            "movie-list"
        );


    if (movies.length === 0) {

        container.innerHTML = `

            <div class="col-12">

                <div class="alert alert-secondary">

                    No movies found.

                </div>

            </div>

        `;

        return;

    }


    container.innerHTML =
        movies.map(movie => `

            <div
                class="col-md-6 col-lg-4"
            >

                <div
                    class="card h-100
                           border-0 shadow-sm"
                >

                    <div class="card-body">

                        <h5
                            class="card-title fw-bold"
                        >
                            ${escapeHtml(movie.title)}
                        </h5>


                        <p class="mb-2">

                            <strong>
                                Director:
                            </strong>

                            ${escapeHtml(movie.director)}

                        </p>


                        <p class="mb-2">

                            <strong>
                                Release Year:
                            </strong>

                            ${movie.release_year}

                        </p>


                        <p class="text-muted small">

                            Created by:
                            ${escapeHtml(
                                movie.created_by ?? "Unknown"
                            )}

                        </p>


                        <p
                            class="card-text text-muted"
                        >

                            ${escapeHtml(
                                truncate(
                                    movie.description,
                                    120
                                )
                            )}

                        </p>

                    </div>


                    <div
                        class="card-footer bg-white
                               border-0"
                    >

                        <a
                            href="/movies/${movie.id}/"
                            class="btn
                                   btn-outline-primary
                                   btn-sm"
                        >
                            View Details
                        </a>

                    </div>

                </div>

            </div>

        `).join("");

}



function updatePagination(totalCount) {

    const previousButton =
        document.getElementById(
            "previous-button"
        );

    const nextButton =
        document.getElementById(
            "next-button"
        );


    previousButton.disabled =
        !previousPage;

    nextButton.disabled =
        !nextPage;


    document.getElementById(
        "page-info"
    ).textContent =
        `Page ${currentPage} • ${totalCount} movies`;

}



function truncate(value, length) {

    const text =
        String(value ?? "");


    if (text.length <= length) {

        return text;

    }


    return text.slice(
        0,
        length
    ) + "...";

}



function escapeHtml(value) {

    const element =
        document.createElement("div");

    element.textContent =
        String(value ?? "");

    return element.innerHTML;

}



document.getElementById(
    "filter-button"
).addEventListener(
    "click",
    function () {

        loadMovies(1);

    }
);



document.getElementById(
    "search"
).addEventListener(
    "keydown",
    function (event) {

        if (event.key === "Enter") {

            loadMovies(1);

        }

    }
);



document.getElementById(
    "previous-button"
).addEventListener(
    "click",
    function () {

        if (previousPage) {

            loadMovies(
                currentPage - 1
            );

        }

    }
);



document.getElementById(
    "next-button"
).addEventListener(
    "click",
    function () {

        if (nextPage) {

            loadMovies(
                currentPage + 1
            );

        }

    }
);


loadMovies();

</script>

{% endblock %}
